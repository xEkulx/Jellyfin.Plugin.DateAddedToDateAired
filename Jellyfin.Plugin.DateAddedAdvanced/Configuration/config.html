<!DOCTYPE html>
<html>
<head><title>Date Added To Date Aired</title></head>
<body>
<div id="DateAddedToDateAiredConfigPage" data-role="page" class="page type-interior pluginConfigurationPage" data-require="emby-input,emby-button,emby-checkbox">
  <div data-role="content"><div class="content-primary">
    <form id="DateAddedToDateAiredConfigForm">
      <div class="inputContainer"><label class="emby-checkbox-label"><input id="enableMovies" type="checkbox" is="emby-checkbox" /><span>Enable Movies</span></label></div>
      <div class="inputContainer"><label class="emby-checkbox-label"><input id="enableEpisodes" type="checkbox" is="emby-checkbox" /><span>Enable TV Episodes</span></label></div>
      <div class="inputContainer"><label class="emby-checkbox-label"><input id="automatic" type="checkbox" is="emby-checkbox" /><span>Process new items automatically after metadata updates</span></label></div>
      <div class="inputContainer"><label class="emby-checkbox-label"><input id="skipFuture" type="checkbox" is="emby-checkbox" /><span>Leave future release/air dates unchanged</span></label></div>
      <p>Only Jellyfin's internal Date Added value is changed. NFO files and media files are never modified. Items without a date are left unchanged.</p>
      <button is="emby-button" type="submit" class="raised button-submit block emby-button"><span>Save</span></button>
    </form>
  </div></div>
</div>
<script>
(() => {
  const page = document.querySelector('#DateAddedToDateAiredConfigPage');
  page.addEventListener('pageshow', () => ApiClient.getPluginConfiguration(PluginConfig.pluginId).then(c => {
    enableMovies.checked = c.EnableMovies; enableEpisodes.checked = c.EnableTvEpisodes;
    automatic.checked = c.ProcessNewItemsAutomatically; skipFuture.checked = c.SkipFuturePremiereDates;
  }));
  document.querySelector('#DateAddedToDateAiredConfigForm').addEventListener('submit', e => { e.preventDefault(); ApiClient.getPluginConfiguration(PluginConfig.pluginId).then(c => {
    c.EnableMovies = enableMovies.checked; c.EnableTvEpisodes = enableEpisodes.checked;
    c.ProcessNewItemsAutomatically = automatic.checked; c.SkipFuturePremiereDates = skipFuture.checked;
    ApiClient.updatePluginConfiguration(PluginConfig.pluginId, c).then(Dashboard.processPluginConfigurationUpdateResult);
  }); });
})();
</script>
</body>
</html>
